<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="14" rx="2.5" />
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01" />
            <path d="M9 14h6" />
            <path d="M7 18h10" />
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Typing Speed Test</h1>
          <p class="brand-subtitle" id="subtitle">Type as fast as you can in 60 seconds</p>
        </div>
      </div>
      <div class="best" id="personal-best">
        <svg class="trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
          <path d="M4 22h16" />
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
        </svg>
        <span id="personal-best-text">No personal best yet</span>
      </div>
    </header>

    <section class="stats-bar">
      <div class="stats">
        <div class="stat">
          <span class="stat-label">WPM:</span>
          <span class="stat-value" id="wpm">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-label">Accuracy:</span>
          <span class="stat-value" id="accuracy">100%</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-label">Time:</span>
          <span class="stat-value time" id="time">1:00</span>
        </div>
      </div>
      <div class="controls">
        <div class="control-group">
          <span class="control-label">Difficulty:</span>
          <div class="button-group" id="difficulty-group" role="group" aria-label="Difficulty">
            <button type="button" data-difficulty="easy">Easy</button>
            <button type="button" data-difficulty="medium">Medium</button>
            <button type="button" data-difficulty="hard" class="active">Hard</button>
          </div>
        </div>
        <div class="control-divider"></div>
        <div class="control-group">
          <span class="control-label">Mode:</span>
          <div class="button-group" id="mode-group" role="group" aria-label="Mode">
            <button type="button" data-mode="timed" class="active">Timed (60s)</button>
            <button type="button" data-mode="passage">Passage</button>
          </div>
        </div>
      </div>
    </section>

    <section class="passage-section">
      <div
        class="passage"
        id="passage"
        tabindex="0"
        role="textbox"
        aria-label="Typing passage"
      ></div>
      <div class="actions">
        <button id="start-btn" class="primary-btn" type="button">Start</button>
        <button id="restart-btn" class="secondary-btn" type="button" hidden>Restart</button>
      </div>
    </section>
  </main>

  <div class="results-overlay" id="results-overlay" hidden>
    <div class="results-card" role="dialog" aria-modal="true" aria-labelledby="results-title">
      <h2 id="results-title">Results</h2>
      <p class="results-message" id="results-message"></p>
      <div class="results-stats">
        <div class="result-stat">
          <span class="result-label">WPM</span>
          <span class="result-value" id="result-wpm">0</span>
        </div>
        <div class="result-stat">
          <span class="result-label">Accuracy</span>
          <span class="result-value" id="result-accuracy">0%</span>
        </div>
        <div class="result-stat">
          <span class="result-label">Correct</span>
          <span class="result-value correct" id="result-correct">0</span>
        </div>
        <div class="result-stat">
          <span class="result-label">Incorrect</span>
          <span class="result-value incorrect" id="result-incorrect">0</span>
        </div>
      </div>
      <div class="results-actions">
        <button id="results-close" class="primary-btn" type="button">Try Again</button>
      </div>
    </div>
  </div>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
